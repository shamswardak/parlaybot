name: Daily parlays

on:
  schedule:
    # 13:00 UTC = 9:00 AM ET (8:00 AM once EST starts in November).
    # Deliberately early: GitHub's scheduler queue runs hours late, and the
    # bot prices from its own model rather than live odds, so there is no
    # reason to wait for the market. Nine gives ~3 hours of drift before the
    # 1:05 first pitches, which is what a weekend slate lives or dies on.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport"
        type: choice
        default: "All"
        options: ["All", "MLB", "NFL", "NBA", "NHL"]
      date:
        description: "Slate date YYYY-MM-DD (blank = today ET)"
        required: false
      dry_run:
        description: "Print only, do not post to Discord"
        type: boolean
        default: false
      skip_grade:
        description: "Skip grading"
        type: boolean
        default: true

concurrency:
  # Separate lanes per trigger. With one shared group, a manual run left
  # hanging blocks every scheduled run behind it, since nothing is cancelled.
  group: daily-parlays-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: parlaybot-cache-${{ github.run_id }}
          restore-keys: |
            parlaybot-cache-

      - name: Grade previous slates
        if: ${{ github.event_name == 'schedule' || github.event.inputs.skip_grade != 'true' }}
        continue-on-error: true
        env:
          DISCORD_RESULTS_WEBHOOK_URL: ${{ secrets.DISCORD_RESULTS_WEBHOOK_URL }}
          TZ: America/New_York
        run: python -m parlaybot.grade_main

      - name: Build and send
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ONDEMAND_WEBHOOK_URL: ${{ secrets.DISCORD_ONDEMAND_WEBHOOK_URL }}
          TZ: America/New_York
        run: |
          ARGS=""
          SPORT="${{ github.event.inputs.sport }}"

          # Every manual run is ad-hoc: its own channel, its own history file,
          # so it can never overwrite the scheduled ticket the grader is
          # waiting to settle. Only the schedule writes the daily file.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="$ARGS --on-demand"
          fi
          if [ -n "$SPORT" ] && [ "$SPORT" != "All" ]; then
            ARGS="$ARGS --sports $SPORT"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python -m parlaybot.main $ARGS

      - name: Commit history
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "parlaybot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --staged --quiet; then
            echo "nothing new to record"
          else
            git commit -m "history: $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Upload ticket JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parlays
          path: output/*.json
          if-no-files-found: ignore
          retention-days: 30
