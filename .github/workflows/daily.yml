name: Daily parlays

on:
  schedule:
    # 16:00 UTC = 12:00 PM ET (daylight saving). Becomes 11am ET in November —
    # change to "0 17 * * *" then if you want to hold noon year round.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      sports:
        description: "Comma-separated sports override (e.g. MLB,NFL)"
        required: false
      date:
        description: "Slate date YYYY-MM-DD (defaults to today ET)"
        required: false
      dry_run:
        description: "Print only, do not post to Discord"
        type: boolean
        default: false
      skip_grade:
        description: "Skip grading, just build today's tickets"
        type: boolean
        default: false

concurrency:
  group: daily-parlays
  cancel-in-progress: false

# Needed so the run can commit history/ back to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: parlaybot-cache-${{ github.run_id }}
          restore-keys: |
            parlaybot-cache-

      # Grade first: the build below reads the calibration this step refits.
      # continue-on-error so a grading problem never blocks today's tickets.
      - name: Grade previous slates
        if: ${{ github.event.inputs.skip_grade != 'true' }}
        continue-on-error: true
        env:
          DISCORD_RESULTS_WEBHOOK_URL: ${{ secrets.DISCORD_RESULTS_WEBHOOK_URL }}
          TZ: America/New_York
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python -m parlaybot.grade_main $ARGS

      - name: Build and send
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PARLAYBOT_SPORTS: ${{ github.event.inputs.sports }}
          TZ: America/New_York
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m parlaybot.main $ARGS

      # history/ is the permanent record: today's tickets for tomorrow's
      # grader, every settled leg, and the calibration fitted from them.
      - name: Commit history
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "parlaybot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --staged --quiet; then
            echo "nothing new to record"
          else
            git commit -m "history: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Upload ticket JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parlays
          path: output/*.json
          if-no-files-found: ignore
          retention-days: 30
