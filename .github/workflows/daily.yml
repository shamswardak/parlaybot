name: Daily parlays

on:
  schedule:
    # Five firings, not one. GitHub's scheduler queue runs 2-4 hours late and
    # sometimes drops a firing entirely (Sep 15 never ran). Whichever of these
    # GitHub actually starts first does the build; the rest see today's ticket
    # already in history/ and exit in seconds. 13:00-17:00 UTC = 9 AM - 1 PM ET.
    - cron: "0 13,14,15,16,17 * * *"
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport"
        type: choice
        default: "All"
        options: ["All", "MLB", "NFL", "NBA", "NHL"]
      date:
        description: "Slate date YYYY-MM-DD (blank = today ET)"
        required: false
      dry_run:
        description: "Print only, do not post to Discord"
        type: boolean
        default: false
      skip_grade:
        description: "Skip grading"
        type: boolean
        default: true

concurrency:
  # Separate lanes per trigger, so a hung manual run can't block the schedule.
  # Within the schedule lane the firings serialize, which is what makes the
  # "already built" check below reliable.
  group: daily-parlays-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Should this firing build?
        id: guard
        env:
          TZ: America/New_York
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run — always builds"
            echo "build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          TODAY=$(date +%F)
          HOUR=$((10#$(date +%H)))
          if [ -f "history/parlays-$TODAY.json" ]; then
            echo "$TODAY already built by an earlier firing — nothing to do"
            echo "build=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Lineups post a few hours before first pitch. Before 11 ET the
          # source falls back to the active roster, which means guessing at
          # who actually plays. Let a later firing take it instead.
          if [ "$HOUR" -lt 11 ]; then
            echo "only ${HOUR}:00 ET — too early for confirmed lineups, skipping"
            echo "build=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "building for $TODAY at ${HOUR}:00 ET"
          echo "build=true" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.build == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.build == 'true'

      - name: Restore data cache
        if: steps.guard.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: parlaybot-cache-${{ github.run_id }}
          restore-keys: |
            parlaybot-cache-

      - name: Grade previous slates
        if: ${{ steps.guard.outputs.build == 'true' && (github.event_name == 'schedule' || github.event.inputs.skip_grade != 'true') }}
        continue-on-error: true
        env:
          DISCORD_RESULTS_WEBHOOK_URL: ${{ secrets.DISCORD_RESULTS_WEBHOOK_URL }}
          TZ: America/New_York
        run: python -m parlaybot.grade_main

      - name: Build and send
        if: steps.guard.outputs.build == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ONDEMAND_WEBHOOK_URL: ${{ secrets.DISCORD_ONDEMAND_WEBHOOK_URL }}
          TZ: America/New_York
        run: |
          ARGS=""
          SPORT="${{ github.event.inputs.sport }}"

          # Every manual run is ad-hoc: its own channel, its own history file,
          # so it can never overwrite the scheduled ticket the grader is
          # waiting to settle. Only the schedule writes the daily file.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="$ARGS --on-demand"
          fi
          if [ -n "$SPORT" ] && [ "$SPORT" != "All" ]; then
            ARGS="$ARGS --sports $SPORT"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python -m parlaybot.main $ARGS

      - name: Commit history
        if: ${{ steps.guard.outputs.build == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "parlaybot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --staged --quiet; then
            echo "nothing new to record"
          else
            git commit -m "history: $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Upload ticket JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parlays
          path: output/*.json
          if-no-files-found: ignore
          retention-days: 30
