# parlaybot configuration
#
# Every price this bot prints is a MODEL ESTIMATE, not a quote. There is no live
# odds feed wired in, so the numbers tell you what to go looking for in the app.

# Which sports to pull. Out-of-season leagues report "no games today" and are
# skipped, so leaving all four on year-round is fine.
sports:
  - MLB
  - NFL
  - NBA
  - NHL

# Assumed two-way market overround on alternate player props. 0.06 == a 106%
# market. Raise it and the bot's estimated prices get shorter (more conservative);
# lower it and they get longer. 0.05-0.08 is the realistic range for DK/FD alts.
market_hold: 0.06

# Skip any game that has already started, or starts within this many minutes.
# A game in progress can't be bet at the prices the model estimated, and its
# legs may be half-decided already. Raise it if you want more time to shop.
min_minutes_to_start: 20

# Hard outer limit. No leg outside this is ever considered, whatever ticket
# it might land on. Wide enough to cover every ticket band below.
price_band: [-1400, -150]

# What the scheduled run posts each day. ONE ticket, since one is what you
# actually place — three tickets was three ways to lose the same evening.
#
# The choice is from the record, not taste. Over the first four days the legs
# themselves priced honestly (93 graded legs: 80.4% predicted, 80.6% actual),
# but ticket length decided everything:
#
#   ticket     per leg  legs   win%   payout   break-even   edge
#   Daily        89.7%    10  33.6%    +429        18.9%   +14.6
#   Trend 5      75.0%     5  23.7%    +254        28.2%    -4.5
#   Safe 20      78.4%    18   1.2%    +653        13.3%   -12.0
#
# Safe 20 fails as arithmetic, not as a bug: twenty legs compounds a 3-point
# per-leg error into a halved ticket, and 7.5x doesn't pay for that. Trend 5
# is priced right and still short of its break-even. Both stay defined below
# under on_demand_tickets and can be built by hand any time.
#
# A ticket is correct when every leg meets its criteria — there is no payout
# target. If the slate can't fill it, the criteria loosen a step at a time
# (band widens by ~2% implied probability per step, streak requirement drops
# by 1) and the ticket says it was loosened.
#
#   price_min / price_max   the band, in American odds
#   sports                  omit for every enabled sport
#   min_streak              consecutive games the player must have hit it
#   require_current_season  false lets last season's form through, for tickets
#                           where the price itself is the safety
tickets:
  - name: "Daily Ticket"
    # Formerly "Core 10". Named without the number because the slate doesn't
    # always have ten legs that qualify — 8 on 9/13, 10 on 9/14 and 9/15 — and
    # a short ticket of legs that meet the criteria beats a full one padded
    # with legs that don't.
    n_legs: 10
    price_min: -700
    price_max: -450
    preferred_sports: ["MLB"]   # a preference, not a restriction: MLB fills
                                # first because it has months of current-season
                                # form behind every leg. Other sports fill in
                                # behind it, and take over entirely if you run
                                # with one sport selected.
    min_streak: 0
    require_current_season: true
    max_legs_per_game: 2
    # Two relaxation passes, not five. On 9/13 five passes stretched the band
    # from -450/-700 out to -314/-1438 and STILL only found 8 legs — legs that
    # aren't the ones the edge above was measured on. A 6-leg ticket whose legs
    # all meet the criteria is the bet you actually tested; an 8-leg ticket
    # with three legs outside the band is a different bet wearing its name.
    relax_steps: 2

# Not built by the scheduled run, and no longer offered by the on-demand form
# either — that form builds the Daily Ticket for whichever sport you pick.
# Kept here so retiring a ticket doesn't mean losing its definition: both are
# still reachable by hand with `--ticket "Safe 20"`.
on_demand_tickets:
  - name: "Safe 20"
    n_legs: 20            # DraftKings caps a parlay at 20 legs (FanDuel 25)
    price_min: -1400
    price_max: -550       # hitters: -550 to -700 is the honest safe range
    prefer: "safe"        # rank by price, not by streak — safety is the point
    # Markets don't price alike. A starter's strikeout floor really does reach
    # -900 because his innings are predictable; no hitter prop does. So pitcher
    # markets get their own heavier band and first call on the 20 slots.
    market_bands:
      Strikeouts: [-1600, -800]
      Outs Recorded: [-1600, -700]
    preferred_markets: ["Strikeouts", "Outs Recorded"]
    min_streak: 0
    require_current_season: false   # near-certain lines hold up in Week 1 too
    max_legs_per_game: 2

  - name: "Trend 5"
    n_legs: 5
    price_min: -400
    price_max: -150
    preferred_sports: ["MLB"]
    min_streak: 5         # the whole point of this ticket; relaxes to 4, then 3
    require_current_season: true
    max_legs_per_game: 1

trend:
  window: 15              # rolling trend window, in games
  min_games: 8            # hard floor on sample size — no 3-game "trends"
  decay: 0.93             # per-game-back weight; 0.93 ≈ last 8 games carry ~60%
  prior_strength: 25.0    # pseudo-games of season prior. THE key dial: at 5 the
                          # 15-game window drowned the season rate and the bot
                          # priced a 61%-season hitter at -1010 where FanDuel
                          # had -320. At 25 the same leg prices -303.
  league_prior: 0.55
  max_trend_bonus: 0.05   # cap on the streak bonus. Small on purpose: the
                          # streak IS the hot window, already weighted above.
  max_model_prob: 0.93    # ceiling — no player prop is a 95% certainty
  b2b_penalty: 0.12       # back-to-back / short rest
  road_penalty: 0.04
  volatility_penalty: 0.30
  min_confidence: 0.45    # legs below this are dropped entirely
  use_prior_season: true   # generated and tagged; only the Safe ticket accepts them
  strong_recent_games: 8  # the "strong trend" exception: all 8 of the last 8...
  strong_window_rate: 0.80  # ...AND 80% of the 15-game window (12/15)

# Feed graded results back into the model. The grader writes history/legs.jsonl
# and history/calibration.json; the next build reads the calibration and nudges
# its probability estimates toward what actually happens.
use_calibration: true

calibration:
  min_samples: 60         # graded legs in a bucket before any correction applies
  prior_weight: 200.0     # shrinkage: correction scales as n / (n + this)
  max_shift: 0.45         # hard clamp on the correction, in log-odds
  per_sport: true         # learn MLB and NFL separately, falling back to pooled

output_dir: output        # throwaway copy, picked up as an Actions artifact
history_dir: history      # committed back to the repo — the grader reads this

# Current-season games a player needs before the bot will price him. WAIVED
# when you run with a single sport selected — choosing NFL on its own is a
# deliberate request, and being handed nothing is a worse answer than thin legs
# that say they're thin. This is
# what keeps NFL out of the tickets in Week 1 and NBA/NHL out in late October,
# instead of falling back on last season's form — which is a different roster,
# a different role, and not a trend. MLB carries the slate until the others
# have real samples.
min_season_games:
  MLB: 8
  NFL: 4      # ~Week 5, since a player needs 4 games played
  NBA: 8
  NHL: 8
