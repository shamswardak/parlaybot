# parlaybot configuration
#
# Every price this bot prints is a MODEL ESTIMATE, not a quote. There is no live
# odds feed wired in, so the numbers tell you what to go looking for in the app.

# Which sports to pull. Out-of-season leagues report "no games today" and are
# skipped, so leaving all four on year-round is fine.
sports:
  - MLB
  - NFL
  - NBA
  - NHL

# Assumed two-way market overround on alternate player props. 0.06 == a 106%
# market. Raise it and the bot's estimated prices get shorter (more conservative);
# lower it and they get longer. 0.05-0.08 is the realistic range for DK/FD alts.
market_hold: 0.06

# Skip any game that has already started, or starts within this many minutes.
# A game in progress can't be bet at the prices the model estimated, and its
# legs may be half-decided already. Raise it if you want more time to shop.
min_minutes_to_start: 20

# Hard limits: a leg priced outside this is never considered, at any trend.
price_band: [-1200, -400]

# Free-entry band. Legs priced inside this stand on their own merits. Legs
# outside it but still inside price_band need a STRONG TREND to make a ticket:
#   - too light (-400 to -550): pays well but likeliest to lose the ticket
#   - too heavy (-900 to -1200): near-certain but eats payout for little safety
# Strong trend is defined under trend.strong_* below. Set this equal to
# price_band to turn the gate off entirely.
core_price_band: [-900, -550]

# One entry per ticket generated each day. Tickets do not share players.
parlays:
  - name: "Max Trend"
    n_legs: 20
  - name: "Balanced"
    n_legs: 18
  - name: "Lean"
    n_legs: 15

trend:
  window: 15              # rolling trend window, in games
  min_games: 8            # hard floor on sample size — no 3-game "trends"
  decay: 0.93             # per-game-back weight; 0.93 ≈ last 8 games carry ~60%
  prior_strength: 5.0     # pseudo-games of season-long prior mixed in
  league_prior: 0.55
  max_trend_bonus: 0.18   # cap on the streak bonus, in log-odds
  b2b_penalty: 0.12       # back-to-back / short rest
  road_penalty: 0.04
  volatility_penalty: 0.30
  min_confidence: 0.45    # legs below this are dropped entirely
  strong_recent_games: 8  # the "strong trend" exception: all 8 of the last 8...
  strong_window_rate: 0.80  # ...AND 80% of the 15-game window (12/15)

build:
  target_american: 1500   # +1500 ≈ 16x your stake
  min_legs: 15            # preferred floor, NOT a hard wall
  max_legs: 20
  absolute_min_legs: 4    # on a thin slate, build the best ticket available
                          # down to this many legs and flag that it's short
                          # rather than refusing to build at all
  max_legs_per_game: 2    # normal cap — cross-game legs multiply honestly
  thin_slate_max_per_game: 10
                          # ceiling the cap stretches to when there aren't
                          # enough games to fill the ticket. Set to 2 to keep
                          # the strict cap and get no ticket on a one-game
                          # slate; raise it for more legs out of fewer games.
                          # Note books cap same-game parlays (DK ~12 legs).
  prefer_cross_game: true # fill every distinct game before doubling up
  tolerance: 0.12         # acceptable |log(actual/target)| before it stops tuning
  error_weight: 12.0      # how hard to push toward the payout target vs. confidence
  max_iterations: 400

# Feed graded results back into the model. The grader writes history/legs.jsonl
# and history/calibration.json; the next build reads the calibration and nudges
# its probability estimates toward what actually happens.
use_calibration: true

calibration:
  min_samples: 60         # graded legs in a bucket before any correction applies
  prior_weight: 200.0     # shrinkage: correction scales as n / (n + this)
  max_shift: 0.45         # hard clamp on the correction, in log-odds
  per_sport: true         # learn MLB and NFL separately, falling back to pooled

output_dir: output        # throwaway copy, picked up as an Actions artifact
history_dir: history      # committed back to the repo — the grader reads this
